# Production optimizer recipe: Muon (hidden matrices) + AdamW (embeddings,
# norms, scalars). Muon lr=0.02 = the proxy-phase Pareto optimum; shared
# verbatim by every 3B lineage run and the 7B throughput program.
# Values are written exactly as the pre-inheritance configs had them
# (note `6e-4` parses as a YAML string; argparse's type=float converts it).

muon_lr: 0.02
muon_momentum: 0.95
muon_weight_decay: 0.01
muon_ns_iterations: 5
muon_ns_coefficients: gram_ns
adamw_lr: 6e-4
adamw_beta1: 0.9
adamw_beta2: 0.95
adamw_weight_decay: 0.1
gradient_clip: 1.0
