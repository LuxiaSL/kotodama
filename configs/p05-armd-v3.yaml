# Proxy re-run of ARM-D (dyadic NCA) on the v3 generator. Question: does the
# ledger read leave the anti-copy floor (acc > chance 0.100 at >=1 checkpoint;
# the ARM-D-lite arms on the earlier writer sat at 0.068-0.070)?
#
# Recipe = the ARM-D-lite config (p5-ddv1.yaml, not in this repo) with ONLY
# the v3 deltas: v3 bin, doc_masking on (v3 reserves EOS=0 and writes it
# between every episode), dense checkpoints (the formation curve is the
# product), a 6-GPU batch geometry. Everything else is copied, not tuned.
#
# Launch: tools/run_train.sh --config configs/p05-armd-v3.yaml
#   with KOTODAMA_NPROC=6 (run_train.sh defaults to 8 ranks).

# Optimizer: Muon 0.02 / AdamW 6e-4, clip 1.0 — identical to p5-ddv1.yaml.
extends: base/optim-muon.yaml

model_size: proxy
attn_res: true
# DD-v1 (presets.DDV1, the proxy's DEFAULT_BOUNDARIES) — train.py takes a
# literal string; tests/test_p05_staging.py pins it to the preset.
attn_res_boundaries: "0,3,7,12,21,25"

sequence_length: 4096
# ASSUMPTION (batch): p5-ddv1.yaml ran 131,072 tok/step (4 GPU x mb 4 x
# accum 2). 131,072 is not reachable on 6 ranks (32 seqs / 6), and train.py
# silently FLOORS grad_accum, so this is 6 GPU x mb 6 x accum 1 = 147,456
# tok/step (+12.5% vs p5-ddv1). Valid for EXACTLY 6 ranks: on 8 ranks the floor
# gives 196,608/step. 5,086 steps total.
micro_batch_size: 6
global_batch_tokens: 147456

total_tokens: 750_000_000
# ASSUMPTION (schedule): copied verbatim from p5-ddv1.yaml (200 steps =
# 29.5M tokens at this batch; p5-ddv1 was 26.2M). Not re-tuned.
warmup_steps: 200
decay_start_pct: 0.90
decay_type: cosine

# Data: v3 writer output (nca_v3.bin after --finalize). EOS=0 separates
# episodes; dataset.py's eos_id default is 0 = the writer's EOS_ID.
data_path: ${KOTODAMA_DATA_ROOT}/p05-dyadic-v3/nca_v3.bin
doc_masking: true
seed: 42

# Runtime: as p5-ddv1.yaml (compile on, no fp8/Liger/AC at proxy scale).
compile: true
attn_impl: auto
fp8: false
use_liger: false
activation_checkpointing: false

# Checkpoints: every 340 steps = 50.1M tokens -> 14 periodic + the final
# (step 5085) = 15 points on the formation curve. 340 is chosen so the
# final save never lands on a periodic step. Keep all of them.
checkpoint_dir: ${KOTODAMA_DATA_ROOT}/p05/armd-v3
save_every: 340
keep_checkpoints: 100
async_checkpoint: true
# Run-private SHM staging: the shared /dev/shm/kotodama-ckpts is scanned
# for step_*.pt by every async run on the node, and same-numbered steps from
# a concurrent run would collide. The SHM copies persist after the run.
checkpoint_shm_dir: /dev/shm/kotodama-p05-armd-v3

geo_monitor: false
log_every: 50
wandb: false
