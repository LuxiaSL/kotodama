# Named checkpoints (kotodama.ckpt). Paths relative to $KOTODAMA_DATA_ROOT.
# A site adds private models with KOTODAMA_CKPT_REGISTRY=/path/to/more.yaml.
#
# name:
#   path: file under the data root (or absolute)
#   size: preset name (kotodama.presets)
#   boundaries: dd3b | ddv1 | null (no AttnRes)
#   hf: <repo>/<file> on the Hugging Face Hub, if published

kotodama-3b-base-final:
  path: 3b-language-FINAL-step195311.pt
  size: 3b
  boundaries: dd3b
  hf: aethera-gp/kotodama-3b-base-final/step_00195311.pt.zst
  note: 384B tokens + cooldown, step 195311 — the base model

kotodama-3b-nca-phase3:
  path: nca-3b-phase3-BASE.pt.zst
  size: 3b
  boundaries: dd3b
  note: NCA pre-pretraining output (AttnRes co-trained) — the language run's init
