# 3B NCA Phase 1: Raw NCA pretrain (no AttnRes)
# Overshoot methodology: train for 1.5 epochs, pick the knee from geometry
# 3500 rules, 20 sims/rule, seed 17 → 9B unique tokens per epoch
#
# Usage: torchrun --nproc_per_node=8 -m kotodama.training.train --config configs/nca-3b-phase1.yaml

# Shape, optimizer (same as proxy NCA runs), optimization profile, async
# ckpt, geo monitor, logging — the shared 3B lineage base.
extends: base/3b-lineage.yaml

# Training — 13.5B tokens = 1.5 epochs of 9B unique NCA data
total_tokens: 13_500_000_000
warmup_steps: 500
decay_start_pct: 1.0

# Data
data_path: /models/kotodama-data/nca_3b_seed17_train.bin
seed: 17

# Eval
eval_data_path: /models/kotodama-data/nca_3b_seed17_eval.bin
eval_every: 200
eval_batches: 20

# Checkpointing — frequent saves for knee selection
checkpoint_dir: checkpoints/nca-3b-phase1
save_every: 200
keep_checkpoints: 100

# Dense geometric monitoring
geo_monitor_tier1_every: 25
geo_monitor_tier2_every: 200

# Logging
wandb_run_name: nca-3b-phase1-3500rules
