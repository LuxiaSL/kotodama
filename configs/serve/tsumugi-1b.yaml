# kotodama-tsumugi 1B base, served for generation at scale: the one profile a tsumugi fleet runs.
#   tools/run_serve.sh --profile tsumugi-1b [--checkpoint <ckpt>] [--steer-npz <banks>] [--port <p>]
# Keys are server.py flags (kotodama.serve.profiles); a flag on the command line overrides its value here.
#
# Engine: cross-request batching with refill, cascade attention (rows of one prompt share its KV), a prefix KV
# pool in front of every prefill, and per-request steering levers (steered and unsteered requests share batches;
# steering arrives as request fields: vectors / injection / steer_span / penalty_scope). Acceptance for this
# engine configuration: tests/test_levers.py, tests/test_levers_serve.py, tests/test_xbatch.py,
# tests/test_cascade_decode.py, tests/test_prefix_cache.py on CPU, and scripts/benchmark/levers_check.py on a GPU.
#
# Neuron levers (an `injection` of kind mlp at effective layer L) are dosed in units of the median norm of the
# state entering L's MLP, the unit of the neuron explorer (https://github.com/LuxiaSL/neuron-explorer).

# The published release weights (every tensor bit-identical to the release training checkpoint).
checkpoint: hf:LuxiaSL/kotodama-tsumugi-1b
model_size: 1b-tsumugi
rope_fp32: true
mode: base
served_model_name: kotodama-tsumugi-1b
engine: fast
prefix_cache: true
prefix_pool_tokens: 32768
xbatch_rows: [16, 32, 64, 128]
# Kernel benchmarking (max-autotune) where it pays: the single-stream step and the 64- and 128-row buckets (~7%);
# the 16- and 32-row buckets and the prefill blocks compile without it.
autotune_min_rows: 64
xbatch_refill: true
cascade_attn: true
# Lever slots: one per steered request in flight (a request's whole steering, dose included, is one slot), so a
# 128-row batch of steered n=2 requests needs 64.
levers: 64
# A request's `seed` reproduces its candidates whatever shares their batch (seeded requests prefill cold and
# decode on the widest bucket).
seeded_rows: true
# Compiled decode regions round intermediates as eager does, so a signing decoder decodes the tokens an unsigned one
# does (with the fleet's --kernel_pins table): signed and unsigned servers and requests stay token-comparable.
emulate_casts: true
# Every generation is signed (a request's `sign: false` opts out, counted in /info): in flight where the batcher
# decodes it (the row buckets then compile without kernel benchmarking, so signed and unsigned requests decode the
# same tokens; a signed request prefills cold, past the prefix pool, since pooled KV has other bytes), otherwise by
# the idle drain from its record. The spool and the reducer are the site's
# (KOTODAMA_SIGN_SPOOL, KOTODAMA_SIGN_REDUCER, KOTODAMA_SIGN_REDUCER_KWARGS in site.env); a server without them
# refuses to start (--no-sign_default serves unsigned).
sign_default: true
sign_inflight: true
sign_layers: [0, 18, 25, 34, 36, 45, 54, 56, 63, 71]

# No KOTODAMA_ATTNRES_EPS_FP64_COMPAT: the decode engine routes AttnRes with its own math in fp32, which that variable
# does not reach, and post-training trains on the numerics the model is served with.
