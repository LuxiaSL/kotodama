# PROXY 2x2 REBUILD (P3: random init, no AttnRes (baseline))
# 2026-08-03: original March matrix ckpts lost to cleanup; retrained fresh
# on matched data/protocol. Battery = P0.6 (research/planning/FROZEN-P06-*).
model_size: proxy
sequence_length: 4096
micro_batch_size: 4
global_batch_tokens: 131072   # March-matrix protocol: ~45.7K steps for 6B

total_tokens: 6_000_000_000
warmup_steps: 2000
decay_start_pct: 0.90
decay_type: cosine

muon_lr: 0.02
muon_momentum: 0.95
muon_weight_decay: 0.01
muon_ns_iterations: 5
muon_ns_coefficients: gram_ns
adamw_lr: 6e-4
adamw_beta1: 0.9
adamw_beta2: 0.95
adamw_weight_decay: 0.1
gradient_clip: 1.0

# Data: the 3B mix (DELIBERATE deviation from March's FineWeb-Edu — the
# battery's koto-relevant read wants the koto data environment; matched
# across all four arms, same seed = identical sample stream)
data_path: /models/kotodama-data/train.bin
doc_masking: true
seed: 42

compile: true
attn_impl: auto
fp8: false
use_liger: false
activation_checkpointing: false

save_every: 11400   # quarterly-ish + final
keep_checkpoints: 8
async_checkpoint: true
checkpoint_shm_dir: /dev/shm/luxia-base-ckpts
geo_monitor: false
log_every: 100
wandb: false
attn_res: false
checkpoint_dir: /models/kotodama-data/p2x2/p3
