# 7B profiling run — chrome trace + kernel summary for the throughput program.
# Same config as canary-7b but with torch.profiler enabled at steady state.
# (Note: unlike canary-7b, muon_distributed is NOT set here.)
# Usage: torchrun --nproc_per_node=8 -m kotodama.training.train --config configs/bench-7b-profile.yaml

extends: base/7b-throughput.yaml

total_steps: 90

random_data: true

checkpoint_dir: checkpoints/bench-7b-profile
save_every: 999999

# Profiler: steps 60-80 (past compile warmup)
profile: true
profile_start_step: 60
profile_steps: 20
