# 7B profiling run — chrome trace + kernel summary for the throughput program.
# Same config as canary-7b but with torch.profiler enabled at steady state.
# Usage: torchrun --nproc_per_node=8 -m src.training.train --config configs/bench-7b-profile.yaml

model_size: 7b
sequence_length: 4096
micro_batch_size: 4
global_batch_tokens: 2097152

total_steps: 90
warmup_steps: 30
decay_start_pct: 0.95
decay_type: cosine

muon_lr: 0.02
muon_momentum: 0.95
muon_weight_decay: 0.01
muon_ns_iterations: 5
muon_ns_coefficients: gram_ns
adamw_lr: 6e-4
adamw_beta1: 0.9
adamw_beta2: 0.95
adamw_weight_decay: 0.1
gradient_clip: 1.0

attn_res: true
attn_res_n_blocks: 8

random_data: true
doc_masking: true
seed: 42

checkpoint_dir: checkpoints/bench-7b-profile
save_every: 999999
keep_checkpoints: 1

fp8: true
use_liger: true
attn_impl: auto
compile: true
activation_checkpointing: true
prefetch_batches: 2

# Profiler: steps 60-80 (past compile warmup)
profile: true
profile_start_step: 60
profile_steps: 20

log_every: 10
wandb: false
