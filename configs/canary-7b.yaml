# Canary throughput benchmark — 7B (8b dims @ 49K vocab = ~7.18B params)
# Phase-1 baseline for the 7B throughput program (SPEC-7B-THROUGHPUT-2026-07-03).
# AttnRes boundaries: 8 uniform blocks as a THROUGHPUT PLACEHOLDER only —
# production boundaries will be re-derived from 7B geometry (DD-3B pattern).
# Usage: torchrun --nproc_per_node=8 -m src.training.train --config configs/canary-7b.yaml

model_size: 7b
sequence_length: 4096
micro_batch_size: 4
global_batch_tokens: 2097152

# 150 steps: ~50 warmup/compile, ~100 steady-state
total_steps: 150
warmup_steps: 30
decay_start_pct: 0.95
decay_type: cosine

# Optimizer — production recipe
# muon_distributed PROMOTED 2026-07-05: bitwise gloo proof (Phase 0) +
# loss-overlay gate vs same-seed baseline (max |dloss| 0.0012 post-step-50,
# no trend — SPEC Window-2). +3.5-4.5% measured.
muon_distributed: true
muon_lr: 0.02
muon_momentum: 0.95
muon_weight_decay: 0.01
muon_ns_iterations: 5
muon_ns_coefficients: gram_ns
adamw_lr: 6e-4
adamw_beta1: 0.9
adamw_beta2: 0.95
adamw_weight_decay: 0.1
gradient_clip: 1.0

# AttnRes — placeholder uniform blocks (see header)
attn_res: true
attn_res_n_blocks: 8

# Data — random with doc masking so the varlen FA2 path (production) is exercised
random_data: true
doc_masking: true
seed: 42

# No saves
checkpoint_dir: checkpoints/canary-7b
save_every: 999999
keep_checkpoints: 1

# Optimizations — production profile
fp8: true
use_liger: true
attn_impl: auto
compile: true
activation_checkpointing: true
prefetch_batches: 2

# Logging
log_every: 10
wandb: false
