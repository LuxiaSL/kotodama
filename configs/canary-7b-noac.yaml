# 7B ceiling probe — NO activation checkpointing, MB=2.
# Measures the zero-recompute throughput ceiling: per-sublayer AC costs ~+33%
# FLOPs; this run bounds what selective AC (spec B1) can recover.
# Usage: torchrun --nproc_per_node=8 -m src.training.train --config configs/canary-7b-noac.yaml

model_size: 7b
sequence_length: 4096
micro_batch_size: 2
global_batch_tokens: 2097152

total_steps: 150
warmup_steps: 30
decay_start_pct: 0.95
decay_type: cosine

muon_lr: 0.02
muon_momentum: 0.95
muon_weight_decay: 0.01
muon_ns_iterations: 5
muon_ns_coefficients: gram_ns
adamw_lr: 6e-4
adamw_beta1: 0.9
adamw_beta2: 0.95
adamw_weight_decay: 0.1
gradient_clip: 1.0

attn_res: true
attn_res_n_blocks: 8

random_data: true
doc_masking: true
seed: 42

checkpoint_dir: checkpoints/canary-7b-noac
save_every: 999999
keep_checkpoints: 1

# AC OFF — the point of this config
activation_checkpointing: false
fp8: true
use_liger: true
attn_impl: auto
compile: true
prefetch_batches: 2

log_every: 10
wandb: false
