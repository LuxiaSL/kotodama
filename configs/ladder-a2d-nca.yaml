# 1B formation ladder — arm A2d, phase 1 of 2: the A2*-NCA recipe (0.75B tokens, seed 17,
# warmup 60, AttnRes co-trained) on the DYADIC-v3 NCA corpus instead of NCA-v1 — isolates the
# NCA corpus (spec §5 v3: token-level mix, episode separators + reserved EOS, overwrite
# semantics, mixed geometries). The v3 stream reserves EOS, so doc_masking is safe here
