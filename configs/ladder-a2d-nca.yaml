# Phase 2 = configs/ladder-a2d.yaml (resume_nca = this run's final).
#
# Launch: tools/run_train.sh --config configs/ladder-a2d-nca.yaml \
#   --global_batch_tokens 2097152 --data_path <p05-dyadic-v3/nca_v3.bin> \
#   --checkpoint_dir <ladder>/a2d-nca

extends: ladder-a2-nca.yaml

doc_masking: true
checkpoint_shm_dir: /dev/shm/luxia-ladder-a2d-nca
