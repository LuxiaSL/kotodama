# P0.7 bridge probe — full-FT on synthetic entity-tracking curricula (prose triple)
# Ruling (Luxia 2026-08-02): 100M tokens, QUARTERLY checkpoints (25/50/75/100M),
# P0.6 grid at each — the dose-response SLOPE is the read.
# Prereg/results: research/planning/{FROZEN,RESULTS}-P06-*.md; plan §7 P0.7.
# THROWAWAY PROBE ARM — never a keeper checkpoint.

# Model — 3B, DD-3B boundaries (NOT the proxy DD-v1!)
model_size: 3b
attn_res: true
attn_res_boundaries: "0,1,3,7,15,19,24"

# Data — P0.7 curriculum bin (built by probes/p07/p07_curriculum.py)
data_path: /models/kotodama-data/p07-bridge/p07_curriculum.bin
doc_masking: true
seed: 42
sequence_length: 4096
micro_batch_size: 10
global_batch_tokens: 327_680   # 4096 x 10 x 8 ranks -> grad_accum 1, ~305 steps

# Training — 100M tokens, LR = 10% of pretrain peak, warmup then cosine to zero
total_tokens: 100_000_000
muon_lr: 0.002
adamw_lr: 6e-5
warmup_steps: 15
decay_start_pct: 0.10
decay_type: cosine
gradient_clip: 1.0

# Muon (pretrain settings)
muon_momentum: 0.95
muon_weight_decay: 0.01
muon_ns_iterations: 5
muon_ns_coefficients: gram_ns
adamw_beta1: 0.9
adamw_beta2: 0.95
adamw_weight_decay: 0.1

# Weights-only resume from the pristine FINAL checkpoint (fresh optimizer)
resume_weights: /models/kotodama-data/3b-language-FINAL-step195311.pt

# Optimizations — 3b-language production profile (303K tok/s stack).
# 2026-08-02 relaunch fix: first launch OOM'd on all 8 ranks — this config
# had cherry-picked keys from the proxy-era books-cpt template and MISSED
# activation_checkpointing (the OOM), use_liger (proxy-era false), and
# doc_masking. Copied from 3b-language.yaml wholesale now.
compile: true
attn_impl: auto
fp8: true
use_liger: true
activation_checkpointing: true

# Checkpoints — quarterly: every ~25M tokens = 76 steps; keep all 4
checkpoint_dir: /models/kotodama-data/p07-bridge/checkpoints
save_every: 76
keep_checkpoints: 8
async_checkpoint: true
checkpoint_shm_dir: /dev/shm/luxia-base-ckpts

# Monitoring — lean; JSONL metrics only, no wandb for a ~10-minute probe run
geo_monitor: false
log_every: 5
wandb: false
