# 3B Language Pretraining — 384B tokens from NCA Phase 3 checkpoint
#
# Initializes from NCA Phase 3 AttnRes cotrain (step 3000, 5.9B NCA tokens).
# Embed-only reinit: embeddings reinitialized for language, attention/MLP
# circuits preserved from NCA pre-pretraining.
#
# Boundaries MUST match the NCA checkpoint: DD-3B [0,1,3,7,15,19,24].
# (CLAUDE.md references DD-v1 [0,3,7,12,21,25] — that is stale; Phase 3
# re-derived boundaries from the actual 3B geometry.)
#
# Launch via Scheduler:
#   scheduler submit "tools/run_train.sh --config configs/3b-language.yaml" \
#     --name 3b-lang --gpus 8 --node gpu-host \
#     --env WANDB_API_KEY=... --env WANDB_ENTITY=aethera --env HF_TOKEN=...
#
# run_train.sh sets PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True.
# On SIGTERM: blocking checkpoint + clean exit. load_latest() auto-resumes.

# Shape (3B, 4096 ctx, mb 10, 2M-token batch), optimizer (Muon 0.02 + AdamW
# 6e-4, clip 1.0), production profile (303K tok/s: compile/FA auto/fp8/Liger/AC),
# async ckpt via /dev/shm, geo monitor on, wandb luxia-base, log_every 10.
extends: base/3b-lineage.yaml

# Training — 384B tokens, ~183K steps
total_tokens: 384_000_000_000
warmup_steps: 2000
decay_start_pct: 0.90

# AttnRes DD-3B boundaries (must match NCA checkpoint)
attn_res: true
attn_res_boundaries: "0,1,3,7,15,19,24"

# NCA → language transition
resume_nca: /models/kotodama-data/nca-3b-phase3-BASE.pt.zst

# Data
data_path: /models/kotodama-data/train.bin
doc_masking: true
seed: 42

# Eval — disabled (no held-out split carved yet; can add mid-run)
# eval_data_path: /models/kotodama-data/eval.bin
# eval_every: 200
# eval_batches: 10

# Checkpointing
checkpoint_dir: /models/kotodama-data/checkpoints/3b-language
save_every: 200
keep_checkpoints: 20

# Geometric monitoring — decaying schedule
geo_monitor_schedule: "0:25,2000:50,10000:200,50000:500"

# Logging
wandb_run_name: 3b-language-384B
