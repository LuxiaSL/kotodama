# Tier-3 proxy soak — 7B, ~2.4B tokens on the real 3B-mix data (SPEC-7B §5.3).
# Purpose: slow loss-curve divergence + geometric drift (RankMe, stable rank,
# routing entropy/alphas) for Tier-C candidates vs the default stack.
# Run as a PAIR (baseline + candidate) with identical seed/config; overlay
# loss + geometry. Random-data canaries cannot see compounding format bias —
# this is the gate that promotes a number-format change to production.
# Usage (see SPEC Window-3):
#   baseline:  tools/run_train.sh --config configs/soak-7b.yaml \
#                --checkpoint_dir /models/kotodama-data/soak-7b/baseline
#   candidate: KOTODAMA_VENV=/models/kotodama-data/venv-mxfp8 \
#              KOTODAMA_P1_BWD_TORCH=1 tools/run_train.sh \
#                --config configs/soak-7b.yaml --attn_impl fa4 \
#                --fp8_recipe mxfp8 \
#                --checkpoint_dir /models/kotodama-data/soak-7b/candidate

model_size: 7b
sequence_length: 4096
micro_batch_size: 4
global_batch_tokens: 2097152

# ~2.4B tokens; decay tail included so both arms see the same schedule
total_steps: 1150
warmup_steps: 30
decay_start_pct: 0.95
decay_type: cosine

muon_distributed: true
muon_lr: 0.02
muon_momentum: 0.95
muon_weight_decay: 0.01
muon_ns_iterations: 5
muon_ns_coefficients: gram_ns
adamw_lr: 6e-4
adamw_beta1: 0.9
adamw_beta2: 0.95
adamw_weight_decay: 0.1
gradient_clip: 1.0

attn_res: true
attn_res_n_blocks: 8

# Real data — the 3B training mix (same tokenizer/vocab)
data_path: /models/kotodama-data/train.bin
doc_masking: true
seed: 42

# Terminal checkpoint only (step 1149) for optional eval-BPB anchoring;
# checkpoint_dir MUST be overridden per arm (never on /).
checkpoint_dir: /models/kotodama-data/soak-7b/OVERRIDE-ME
save_every: 1149
keep_checkpoints: 1

fp8: true
use_liger: true
attn_impl: auto
compile: true
# Selective AC via Inductor budget (Window-2 default)
activation_checkpointing: false
ac_budget: 0.7
prefetch_batches: 2

# Geometry = the early-warning system this soak exists for
geo_monitor: true
geo_monitor_schedule: "0:25,200:50,600:100"

log_every: 10
wandb: false
