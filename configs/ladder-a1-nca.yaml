# 1B formation ladder — arm A1, phase 1 of 2: NCA-v1 pre-pretraining,
# replicating the shipped 3B's NCA recipe (nca-3b-phase3-cotrain.yaml) at 1B.
# Phase 2 = configs/ladder-a1.yaml (language, resumes from this run's final).
#
# Dose (proportional to params): the 3B base = phase-3 step 3000 at
# 1,966,080 tok/step = 5.90B NCA tokens on ~2.97B params; x (1.42B / 2.97B)
# = 2.82B tokens here. The language phase's 30B comes ON TOP (arms are matched
# on language tokens).
#
# Faithful to the 3B NCA phase: same seed-17 one-rule stream, AttnRes DD-3B
# co-trained from scratch, constant LR after warmup (decay_start_pct 1.0), no
# doc_masking (the v1 stream's EOS=0 collides with the all-zero patch token).
#
# Launch: tools/run_train.sh --config configs/ladder-a1-nca.yaml \
#   --global_batch_tokens 2097152 --data_path <nca_3b_seed17_train.bin> \
#   --checkpoint_dir <ladder>/a1-nca

extends: base/optim-muon.yaml

model_size: 1b
attn_res: true
attn_res_boundaries: "0,1,3,7,15,19,24"

sequence_length: 4096
micro_batch_size: 8
global_batch_tokens: 2097152
total_tokens: 2_820_000_000
# ASSUMPTION: warmup keeps the 3B's warmup FRACTION of the dose (500 of 3000
# steps = 1/6) -> 224 steps. Keeping 500 absolute steps would spend 37% of
# this short phase warming up.
warmup_steps: 224
decay_start_pct: 1.0
decay_type: cosine

doc_masking: false
seed: 17

compile: true
# auto (= FA2, else SDPA) as the 3B NCA phase ran it. fa4 runs here too (the
# dense kotodama::fa4_dense path, ~+20% tok/s), but FA2 is kept for 3B
# faithfulness (and FA2's deterministic backward) and so A1 / A1' stay a matched
# pair — change it only for a new arm, never between A1 and A1'.
attn_impl: auto
use_liger: true
fp8: false
activation_checkpointing: false
muon_distributed: true
prefetch_batches: 2

adamw_no_decay_norms: true
# fp32 Muon masters + momentum: without them bf16 Muon weight decay is a no-op
# and late/anneal updates round away (a bf16-master 1B run left 5.5% of q_proj
# frozen through the anneal).
muon_fp32_master: true
# fp32 RoPE tables (minor: ~10% less shift error).
rope_fp32: true

# Dense formation view of the NCA phase itself (13 points) + the final full.
save_schedule: "250M:end"
save_every: 400
keep_checkpoints: 2
async_checkpoint: true
checkpoint_shm_dir: /dev/shm/luxia-ladder-a1-nca

geo_monitor: true
geo_monitor_schedule: "0:50"
norm_gain_every: 50
log_every: 10
wandb: false
