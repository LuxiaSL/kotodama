# P0.7-v2 bridge probe — the two rescue hypotheses from the v1 negative
# (RESULTS-P06 §9b): (1) STEP-STARVED — batch 65,536 tokens -> ~1,566 steps
# for the same ~100M (v1: 305 @ 0.33M); (2) SHORTCUT-DILUTED — v2 curriculum
# (>=80% tracking-mandatory queries, swap/move-heavy). v2 flat => formation-
# limited at 3B is the standing verdict. THROWAWAY ARM.

model_size: 3b
attn_res: true
attn_res_boundaries: "0,1,3,7,15,19,24"

data_path: /models/kotodama-data/p07-bridge/p07v2_curriculum.bin
doc_masking: true
seed: 42
sequence_length: 4096
micro_batch_size: 2
global_batch_tokens: 65_536   # 4096 x 2 x 8 ranks -> grad_accum 1, ~1,566 steps

total_tokens: 102_000_000
muon_lr: 0.002
adamw_lr: 6e-5
warmup_steps: 50
decay_start_pct: 0.10
decay_type: cosine
gradient_clip: 1.0

muon_momentum: 0.95
muon_weight_decay: 0.01
muon_ns_iterations: 5
muon_ns_coefficients: gram_ns
adamw_beta1: 0.9
adamw_beta2: 0.95
adamw_weight_decay: 0.1

resume_weights: /models/kotodama-data/3b-language-FINAL-step195311.pt

# 3b-language production profile (see p07-bridge.yaml postmortem note)
compile: true
attn_impl: auto
fp8: true
use_liger: true
activation_checkpointing: true

# Quarterly: ~1,556 trained steps -> save every 389
checkpoint_dir: /models/kotodama-data/p07-bridge/checkpoints-v2
save_every: 389
keep_checkpoints: 8
async_checkpoint: true
checkpoint_shm_dir: /dev/shm/luxia-base-ckpts

geo_monitor: false
log_every: 20
wandb: false
