# Benchmark: 3B WITHOUT AttnRes, WITH activation checkpointing + MB=8
# Purpose: measure throughput ceiling without AttnRes overhead
model_size: 3b
sequence_length: 4096
micro_batch_size: 8
global_batch_tokens: 2097152

total_steps: 200
warmup_steps: 30
decay_start_pct: 0.95
decay_type: cosine

muon_lr: 0.02
muon_momentum: 0.95
muon_weight_decay: 0.01
muon_ns_iterations: 5
muon_ns_coefficients: gram_ns
adamw_lr: 6e-4
adamw_beta1: 0.9
adamw_beta2: 0.95
adamw_weight_decay: 0.1
gradient_clip: 1.0

# NO AttnRes
attn_res: false

# Real data with doc masking
data_path: /models/kotodama-data/train.bin
doc_masking: true
seed: 42

checkpoint_dir: /tmp/bench-3b-noattnres
save_every: 999999
keep_checkpoints: 1

# Optimizations
use_liger: true
attn_impl: auto
compile: true
activation_checkpointing: true

# Profiling: steps 150-160
profile: true
profile_start_step: 150
profile_steps: 10
profile_dir: /tmp/bench-3b-noattnres/profile

log_every: 10
wandb: false
