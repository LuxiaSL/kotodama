[project]
name = "kotodama"
version = "0.3.0"
description = "From-scratch LLM pretraining with NCA pre-pretraining, Block Attention Residuals, and Muon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core
    "torch>=2.11.0",
    "transformers>=4.50.0",
    "tokenizers",
    "accelerate",
    "safetensors",
    "datasets",
    "sentencepiece",
    "protobuf",
    "numpy",
    "wandb",
]

[project.optional-dependencies]
# Training: LoRA, flash attention, kernel optimizations
training = [
    "peft",
    "trl",
    "flash-attn",
    "liger-kernel",
    "einops",
]

# The binding benchmark: the in-loop riders suite and `python -m kotodama.eval.binding` (kotodama.bench_plugin)
bench = [
    "binding-bench @ git+https://github.com/anima-research/binding-bench@552601998cad1650605d7e1cf6c57b5637e3d7ad",
]

# Eval: benchmarks, analysis, visualization
eval = [
    "lm-eval",
    "weightwatcher",
    "scikit-learn",
    "scikit-dimension",
    "scipy",
    "matplotlib",
]

# NCA: neural cellular automata experiments (JAX-based)
nca = [
    "jax[cuda12]",
    "flax",
    "einops",
]

# Tests: the CPU suite runs across all cores (pytest-xdist; `-n 0` runs it serially)
dev = [
    "pytest",
    "pytest-xdist>=3.5",
]

# Everything
all = [
    "kotodama[training,eval,nca]",
]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu128"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kotodama = ["anamnesis_models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
